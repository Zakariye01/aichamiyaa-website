<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Received | Aichamiyaa Supplier</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
      color: #f8f8f8;

      border: 1px solid #d4af37;
      border-radius: 16px;
      background: #0b0b0b;
    }

    .logo {
      width: 55px;
      height: 55px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #d4af37;
      border-radius: 50%;
      color: #d4af37;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 12px;
      color: #ffde7b;
    }

    p {
      margin-bottom: 24px;
      color: #dddddd;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 30px;
      background: #d4af37;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
    }

  <main class="confirmation">
